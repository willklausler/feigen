name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No nvidia-hpc: nvfortran rejects stdlib's implicit none(type, external) and links
      # fplotlib's module fplotlib_contour and procedure contour to the same symbol.
      # No intel on Windows: setup-fortran installs no icx there, which fpm needs for stdlib's C files.
      # No LLVM flang 21: it cannot resolve stdlib's kind parameter ilp in an equivalence
      # statement of a submodule (stdlib_lapack_eigv_gen2).
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, version: 14 }
          - { os: ubuntu-24.04, compiler: gcc, version: 13 }
          - { os: macos-15, compiler: gcc, version: 14 }
          - { os: windows-2025, compiler: gcc, version: 14 }
          - { os: ubuntu-24.04, compiler: intel, version: '2026.1' }
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: v0.13.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Let fpm find libgfortran
        # The fpm binary for macOS is linked against a gcc version the runner lacks
        if: runner.os == 'macOS'
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(dirname "$(gfortran -print-file-name=libgfortran.5.dylib)")" >> "$GITHUB_ENV"
      - name: Test (debug)
        run: fpm test --compiler ${{ steps.setup-fortran.outputs.fc }} --profile debug
      - name: Test (release)
        run: fpm test --compiler ${{ steps.setup-fortran.outputs.fc }} --profile release
      - name: Examples and app
        run: |
          fpm run --compiler ${{ steps.setup-fortran.outputs.fc }} --profile release --example --all
          fpm run --compiler ${{ steps.setup-fortran.outputs.fc }} --profile release

  checks:
    name: llms.txt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: llms.txt covers the API and examples
        run: python3 tools/check_docs.py
